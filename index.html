<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karte mit Markierungen</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/BattleNogare/lostparadise_halloween_2025/main/halloween_fav.ico">
  <!-- Halloween-Schrift -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #0b0b10;
      --bg-panel: #14141c;
      --bg-panel-alt: #1a1a24;
      --border-glow: #ff6a00;
      --text-main: #f0e6d8;
      --text-dim: #b7a999;

      --marker-fill: rgba(255,60,0,0.9);
      --marker-stroke: #ff6a00;

      /* Highlight: passe bei Bedarf an (z. B. #FF00FB) */
      --marker-highlight-fill: #0095ff;
      --marker-highlight-stroke: #ff69b4;
    }

    html, body {
      margin:0;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #2a1a1a 0%, #0b0b10 60%);
      color: var(--text-main);
      height:100%;
    }

    #wrap { display:flex; flex-direction:column; min-height:100vh; }

    /* Header */
    header {
      padding:8px 16px;
      background:var(--bg-panel);
      border-bottom:1px solid var(--border-glow);
      box-shadow:0 0 20px rgba(255,106,0,0.4);
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; row-gap:8px;
    }

    #toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; max-width:calc(100% - 240px); }

    .hint { color:var(--text-dim); font-size:0.8rem; line-height:1.4; max-width:600px; }

    /* Brand rechts */
    #brand { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex:none; text-align:right;
      filter: drop-shadow(0 0 8px rgba(255,106,0,0.6)); }

    #logo img { height:46px; width:auto; display:block; }

    .neonText {
      font-family: 'Rubik Wet Paint', cursive;
      font-size: 1.8rem;
      font-weight: 100;
      color: var(--border-glow);
      text-shadow:
        0 0 4px rgba(255,106,0,1),
        0 0 8px rgba(255,106,0,0.8);
      letter-spacing: 0.04em;
      animation: flicker 3s infinite steps(1);
      white-space: nowrap;
    }

    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity:1; }
      20%, 24%, 55% { opacity:0.5; }
      60% { opacity:0.9; }
      90%, 91%, 93%, 94% { opacity:0.3; }
      92%, 95%, 100% { opacity:1; }
    }

    /* Layout */
    #main { flex:1; display:flex; min-height:0; padding:12px; gap:12px; box-sizing:border-box; }

    #stage {
      flex:1; border:2px solid var(--border-glow); border-radius:10px;
      background:var(--bg-panel-alt); overflow:hidden; height:80vh; position:relative;
      box-shadow:0 0 30px rgba(255,106,0,0.2);
    }

    #svgRoot { width:100%; height:100%; background:#000; touch-action:none; }

    #history {
      width:240px; flex:none; display:flex; flex-direction:column;
      border:2px solid var(--border-glow); border-radius:8px; background:var(--bg-panel);
      color:var(--text-main); font-size:0.9rem; box-shadow:0 0 20px rgba(255,106,0,0.3);
      height:80vh;
    }

    #historyHeader {
      padding:8px 10px; border-bottom:1px solid var(--border-glow); font-weight:600; background:var(--bg-panel-alt);
      text-align:center; color:var(--text-main); box-shadow:0 0 12px rgba(255,106,0,0.4);
    }

    #historyList {
      flex:1; overflow:auto; padding:8px 10px;
      scrollbar-width: thin; scrollbar-color: rgba(255,106,0,0.6) #1a1a24;
    }
    #historyList::-webkit-scrollbar { width:8px; }
    #historyList::-webkit-scrollbar-track {
      background:#1a1a24; border-radius:4px; box-shadow:0 0 6px rgba(0,0,0,0.8) inset;
    }
    #historyList::-webkit-scrollbar-thumb {
      background:linear-gradient(180deg, rgba(255,106,0,0.9) 0%, rgba(120,0,0,0.7) 100%);
      border-radius:4px; box-shadow:0 0 8px rgba(255,106,0,0.6); border:1px solid #ff6a00;
    }
    #historyList::-webkit-scrollbar-thumb:hover {
      background:linear-gradient(180deg, rgba(255,106,0,1) 0%, rgba(180,0,60,0.8) 100%);
      box-shadow:0 0 10px rgba(255,106,0,0.9);
    }

    .historyItem {
      padding:6px 8px; border-radius:4px; cursor:default; user-select:none; margin-bottom:6px;
      background:rgba(255,106,0,0.07); box-shadow:0 0 6px rgba(255,106,0,0.3);
      transition:background .1s, box-shadow .1s; color:var(--text-main);
    }
    .historyItem:hover { background:rgba(255,106,0,0.15); box-shadow:0 0 10px rgba(255,106,0,0.5); }

    .marker { cursor: default; }
    .marker circle {
      stroke:var(--marker-stroke); stroke-width:1; fill:var(--marker-fill);
      filter: drop-shadow(0 0 4px rgba(255,106,0,0.8));
      transition:fill .1s, stroke .1s, stroke-width .1s, filter .1s;
    }
    .marker.highlight circle {
      fill:var(--marker-highlight-fill); stroke:var(--marker-highlight-stroke); stroke-width:3;
      filter: drop-shadow(0 0 8px rgba(255,105,180,0.8));
    }

    /* Footer-Signatur */
    #footerSignature {
      position:fixed; bottom:10px; left:15px; font-size:0.8rem; color:var(--text-dim);
      opacity:0.7; font-style:italic; z-index:9999; transition:opacity 0.3s;
    }
    #footerSignature:hover { opacity:1; color:var(--border-glow); text-shadow:0 0 6px var(--border-glow); cursor:default; }

    #markerLayer { pointer-events:none; }
    #markerLayer > g { pointer-events:auto; }
  </style>
</head>
<body>
<div id="wrap">
  <header>
    <div id="toolbar">
      <div class="hint">
        Read-only Ansicht • Scroll = Zoom • Leertaste+Ziehen / Rechtsklick+Ziehen = Pan
      </div>
    </div>

    <div id="brand">
      <div class="neonText">Lostparadise – Halloween-Event</div>
      <div id="logo">
        <img src="https://raw.githubusercontent.com/BattleNogare/lostparadise_halloween_2025/main/halloween.png" alt="Halloween Logo">
      </div>
    </div>
  </header>

  <div id="main">
    <div id="stage">
      <svg id="svgRoot" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <aside id="history">
      <div id="historyHeader">History</div>
      <div id="historyList"></div>
    </aside>
  </div>
</div>

<script>
(function(){
  // === KONFIG ===
  const SVG_PATH='https://raw.githubusercontent.com/BattleNogare/lostparadise_halloween_2025/main/map.svg';
  const WEB_APP_URL='https://script.google.com/macros/s/AKfycbyUq4LMZhjRkzG2pwmNrgG1GdLjFi6H3bivz_2SEDYA0m9_lMrPQjxdFmEo0ukgdeCKKA/exec';
  const TOKEN = null; // read-only braucht keinen Token
  const STORAGE_KEY='markers.v1';

  const ZOOM_FACTOR=1.4, ZOOM_MAX=20;
  const SCALE_OUT=0.8,   SCALE_IN=0.1;

  let svg, markerLayer;
  let vb, baseViewBox;
  let isPanning=false, panStart=null, panStartVB=null, spacePressed=false;

  let markers=[];            // { uid, displayId, px, py, visible, createdAt }
  let markerDomMap={};       // uid -> <g>

  const $=(s,r=document)=>r.querySelector(s);

  // ====== INITIAL SETUP ======
  fetch(SVG_PATH).then(r=>r.text()).then(txt=>{
    $('#svgRoot').outerHTML = txt
      .replace('<svg','<svg id="svgRoot" style="width:100%;height:100%;touch-action:none;background:#000;"')
      .replace('</svg>','<g id="markerLayer"></g></svg>');

    svg = $('#svgRoot');
    markerLayer = $('#markerLayer');

    // Kontextmenü auf Karte aus
    $('#stage').addEventListener('contextmenu', e=>e.preventDefault());
    svg.addEventListener('contextmenu', e=>e.preventDefault());

    // ViewBox init
    if (!svg.getAttribute('viewBox')) {
      const w = parseFloat(svg.getAttribute('width')) || 1000;
      const h = parseFloat(svg.getAttribute('height')) || 1000;
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    }
    {
      const [x,y,w,h] = svg.getAttribute('viewBox').split(/\s+/).map(Number);
      vb = {x,y,width:w,height:h};
      baseViewBox = {...vb};
    }

    // Interaktionen (read-only): KEIN Hinzufügen/Drag/Delete
    // svg.addEventListener('click', onSvgClickAdd); // deaktiviert
    svg.addEventListener('wheel', onWheel, {passive:false});    // Zoom
    svg.addEventListener('mousedown', onMouseDownPan);
    window.addEventListener('mousemove', onMouseMoveAll);
    window.addEventListener('mouseup', onMouseUpAll);

    window.addEventListener('keydown', e=>{
      if(e.code==='Space'){ spacePressed=true; e.preventDefault(); }
    });
    window.addEventListener('keyup',   e=>{
      if(e.code==='Space'){ spacePressed=false; }
    });

    // Daten laden (Sheet -> fallback local)
    loadFromSheet().catch(()=>{
      loadLocal();
      renderMarkers();
      rebuildHistory();
    });
  });

  // ====== VIEWBOX / ZOOM / PAN ======

  function clampViewBox(x,y,width,height){
    if (width  > baseViewBox.width)  width  = baseViewBox.width;
    if (height > baseViewBox.height) height = baseViewBox.height;

    const minX = baseViewBox.x;
    const maxX = baseViewBox.x + baseViewBox.width  - width;
    const minY = baseViewBox.y;
    const maxY = baseViewBox.y + baseViewBox.height - height;

    if (x < minX) x = minX;
    if (x > maxX) x = maxX;
    if (y < minY) y = minY;
    if (y > maxY) y = maxY;

    return {x,y,width,height};
  }

  function setViewBox(newVB, {rerender}){
    vb = newVB;
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.width} ${vb.height}`);
    if (rerender) renderMarkers();
  }

  function getCurrentMarkerRadius(){
    const zoomFactor = baseViewBox.width / vb.width; // 1..ZOOM_MAX
    const t = (zoomFactor - 1) / (ZOOM_MAX - 1);
    const scaleNow = SCALE_OUT*(1 - t) + SCALE_IN*t;
    const baseLen = Math.max(baseViewBox.width, baseViewBox.height);
    return baseLen * 0.006 * scaleNow;
  }

  function percentToAbsXY(m){
    return {
      absX: baseViewBox.x + (m.px/100)*baseViewBox.width,
      absY: baseViewBox.y + (m.py/100)*baseViewBox.height
    };
  }

  function onWheel(e){
    e.preventDefault();

    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const sp = pt.matrixTransform(svg.getScreenCTM().inverse());

    const scale = (e.deltaY<0) ? (1/ZOOM_FACTOR) : ZOOM_FACTOR;
    let newW = vb.width  * scale;
    let newH = vb.height * scale;

    const minW = baseViewBox.width  / ZOOM_MAX;
    const minH = baseViewBox.height / ZOOM_MAX;
    if (newW < minW) newW = minW;
    if (newH < minH) newH = minH;

    if (newW > baseViewBox.width ) newW = baseViewBox.width;
    if (newH > baseViewBox.height) newH = baseViewBox.height;

    const kx=(sp.x - vb.x)/vb.width;
    const ky=(sp.y - vb.y)/vb.height;
    const newX = sp.x - kx*newW;
    const newY = sp.y - ky*newH;

    setViewBox(clampViewBox(newX,newY,newW,newH), {rerender:true});
  }

  function onMouseDownPan(e){
    // Pan: Space+LMB oder RMB (ohne Shift)
    if ((e.button===0 && spacePressed) || (e.button===2)) {
      isPanning=true;
      panStart   ={x:e.clientX,y:e.clientY};
      panStartVB ={...vb};
      e.preventDefault();
    }
  }

  function onMouseMoveAll(e){
    if (!isPanning) return;

    const dx = e.clientX - panStart.x;
    const dy = e.clientY - panStart.y;

    const m = svg.getScreenCTM();
    const scaleX = vb.width  / (m.a * svg.clientWidth);
    const scaleY = vb.height / (m.d * svg.clientHeight);

    const newX = panStartVB.x - dx * scaleX;
    const newY = panStartVB.y - dy * scaleY;

    setViewBox(clampViewBox(newX,newY,vb.width,vb.height), {rerender:false});
  }

  function onMouseUpAll(){ isPanning=false; }

  // ====== RENDER / HISTORY ======

  function renderMarkers(){
    if (!markerLayer) return;
    markerLayer.innerHTML = '';
    markerDomMap = {};

    const r = getCurrentMarkerRadius();

    markers
      .filter(m=>m.visible)
      .forEach(m=>{
        const {absX,absY} = percentToAbsXY(m);

        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.classList.add('marker');
        g.setAttribute('data-uid',m.uid);

        // read-only: keine Interaktionen auf den Markern
        g.addEventListener('mousedown', e => e.preventDefault());
        g.addEventListener('contextmenu', e => e.preventDefault());

        const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('cx',absX);
        c.setAttribute('cy',absY);
        c.setAttribute('r',r);

        g.appendChild(c);
        markerLayer.appendChild(g);
        markerDomMap[m.uid] = g;
      });

    rebuildHistory();
  }

  function rebuildHistory(){
    const list = document.getElementById('historyList');
    if (!list) return;
    list.innerHTML = '';

    markers
      .filter(m=>m.visible)
      .slice()
      .sort((a,b)=>b.createdAt - a.createdAt)
      .forEach(m=>{
        const item = document.createElement('div');
        item.className='historyItem';
        item.textContent='Marker ' + m.displayId;
        item.dataset.uid = m.uid;

        let held=false;
        item.addEventListener('mousedown', e=>{
          if(e.button!==0) return;
          held=true;
          highlightMarker(m.uid,true);
          e.preventDefault();
        });
        window.addEventListener('mouseup', ()=>{
          if(!held) return;
          held=false;
          highlightMarker(m.uid,false);
        });

        list.appendChild(item);
      });
  }

  function highlightMarker(uid,on){
    const g = markerDomMap[uid];
    if(!g)return;
    if(on) g.classList.add('highlight'); else g.classList.remove('highlight');
  }

  // ====== STORAGE (nur Fallback lesen, nie schreiben aufs Backend) ======

  function loadLocal(){
    try { markers = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { markers = []; }
  }

  async function loadFromSheet(){
    const qs = TOKEN ? `?token=${encodeURIComponent(TOKEN)}&t=${Date.now()}` : `?t=${Date.now()}`;
    const res = await fetch(WEB_APP_URL + qs, { method:'GET' });
    if (!res.ok) throw new Error('GET failed');

    const data = await res.json();
    markers = Array.isArray(data.markers)
      ? data.markers.map(m => ({
          uid:        m.uid,
          displayId:  m.displayId,
          px:         Number(m.px),
          py:         Number(m.py),
          visible:    (m.visible === true || m.visible === 'TRUE' || m.visible === 1 || m.visible === '1'),
          createdAt:  m.createdAt ? Number(m.createdAt) : Date.now()
        }))
      : [];

    // localStorage als Cache (read-only ist ok)
    localStorage.setItem(STORAGE_KEY, JSON.stringify(markers));

    renderMarkers();
  }

  // read-only: keine Schreiboperationen
  function upsertRemote(m){ return; }

})();
</script>

<div id="footerSignature">
  Made by <strong>Marius Braun</strong>
</div>
</body>
</html>
